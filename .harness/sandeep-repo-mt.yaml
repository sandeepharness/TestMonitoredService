monitoredService:
  orgIdentifier: default
  projectIdentifier: gitxtest
  identifier: shubhendureposvc_envshubhendurepo
  name: shubhendureposvc_envshubhendurepo
  type: Application
  description: ""
  serviceRef: shubhendureposvc
  environmentRef: envshubhendurepo
  environmentRefList:
  - envshubhendurepo
  sources:
    healthSources:
    - name: v1-dyna-cross-repo
      identifier: v1dynacrossrepo
      type: DynatraceGrailLogs
      version: v2
      spec:
        connectorRef: dynahs
        queryDefinitions:
        - identifier: g1
          name: g1
          groupName: Logs Group
          queryParams:
            serviceInstanceField: "['log.source']"
            timeStampIdentifier: "['timestamp']"
            messageIdentifier: "['content']"
          liveMonitoringEnabled: false
          continuousVerificationEnabled: false
          sliEnabled: false
          query: fetch logs| filter loglevel == "ERROR"
        healthSourceParams: {}
  enabled: false
