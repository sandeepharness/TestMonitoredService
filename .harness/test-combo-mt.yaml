monitoredService:
  orgIdentifier: default
  projectIdentifier: CV_Sanity
  identifier: combosvc_DynEnv
  name: combosvc_DynEnv
  type: Application
  description: ""
  serviceRef: combosvc
  environmentRef: DynEnv
  environmentRefList:
  - DynEnv
  sources:
    healthSources:
    - name: cv-c
      identifier: cvc
      type: Prometheus
      spec:
        connectorRef: promeprojcheck
        metricPacks:
        - identifier: Custom
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: RESP_TIME
            riskCategory: Performance_ResponseTime
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: RESP_TIME
              riskCategory: Performance_ResponseTime
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "avg(up{job=\"cv-datagen\"})"
          groupName: G1
          serviceInstanceFieldName: instance
          isManualQuery: true
  enabled: false
