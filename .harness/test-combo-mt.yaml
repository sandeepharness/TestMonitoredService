monitoredService:
  orgIdentifier: default
  projectIdentifier: CV_Sanity
  identifier: combosvc_DynEnv
  name: combosvc_DynEnv
  type: Application
  description: ""
  serviceRef: combosvc
  environmentRef: DynEnv
  environmentRefList:
  - DynEnv
  sources:
    healthSources:
    - name: cv
      identifier: cv
      type: Splunk
      spec:
        connectorRef: account.spl
        feature: Splunk Cloud Logs
        queries:
