monitoredService:
  orgIdentifier: default
  projectIdentifier: gitxtest
  identifier: importsvcissue_envimportissue
  name: importsvcissue_envimportissue
  type: Application
  description: ""
  serviceRef: importsvcissue
  environmentRef: envimportissue
  environmentRefList:
  - envimportissue
  sources:
    healthSources:
    - name: splunk-hs
      identifier: splunkhs
      type: Splunk
      spec:
        connectorRef: splunkhs
        feature: Splunk Cloud Logs
        queries:
        - name: SPLUNK Logs Query
          query: index=_internal " error " NOT debug source=*splunkd.log*
          serviceInstanceIdentifier: "['host']"
    - name: prome-hs
      identifier: promehs
      type: Prometheus
      spec:
        connectorRef: promlocal
        metricPacks:
        - identifier: Custom
          metricThresholds:
          - metricName: Prometheus Metric
            metricType: Custom
            spec:
              action: FailImmediately
              spec: {}
            criteria:
              type: Absolute
              spec:
                lessThan: 10.0
                greaterThan: 5.0
            type: FailImmediately
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: OTHER
            riskCategory: Performance_Other
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: OTHER
              riskCategory: Performance_Other
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "avg(up{job=\"blast-radius-sim\"})"
          groupName: G1
          serviceInstanceFieldName: instance
          isManualQuery: true
  enabled: false
