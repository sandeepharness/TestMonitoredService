monitoredService:
  orgIdentifier: default
  projectIdentifier: gitxtest
  identifier: importsvcissue_envimportissue
  name: importsvcissue_envimportissue
  type: Application
  description: ""
  serviceRef: importsvcissue
  environmentRef: envimportissue
  environmentRefList:
  - envimportissue
  sources:
    healthSources:
    - name: prome-hs
      identifier: promehs
      type: Prometheus
      spec:
        connectorRef: promlocal
        metricPacks:
        - identifier: Custom
          metricThresholds:
          - metricName: Prometheus Metric
            metricType: Custom
            spec:
              action: FailImmediately
              spec: {}
            criteria:
              type: Absolute
              spec:
                lessThan: 10.0
                greaterThan: 5.0
            type: FailImmediately
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: OTHER
            riskCategory: Performance_Other
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: OTHER
              riskCategory: Performance_Other
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "(sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"\
            online-boutique\",http_response_status_code!~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"\
            online-boutique\"}[5m]))) * 100"
          groupName: G1
          serviceInstanceFieldName: instance
          isManualQuery: true
  enabled: false
