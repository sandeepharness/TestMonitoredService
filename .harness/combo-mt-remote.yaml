monitoredService:
  orgIdentifier: default
  projectIdentifier: gitxtest
  identifier: comboinlinesvc_comboinlineenv
  name: comboinlinesvc_comboinlineenv
  type: Application
  description: ""
  serviceRef: comboinlinesvc
  environmentRef: comboinlineenv
  environmentRefList:
  - comboinlineenv
  sources:
    healthSources:
    - name: cv-combo-prome
      identifier: cvcomboprome
      type: Prometheus
      spec:
        connectorRef: account.promeacc
        metricPacks:
        - identifier: Custom
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: RESP_TIME
            riskCategory: Performance_ResponseTime
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: RESP_TIME
              riskCategory: Performance_ResponseTime
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "avg(up{job=\"cv-datagen\"})"
          groupName: g1
          serviceInstanceFieldName: instance
          isManualQuery: true
  enabled: false
