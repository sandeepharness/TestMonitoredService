monitoredService:
  orgIdentifier: default
  projectIdentifier: gitxtest
  identifier: splunksvc_splunkenv
  name: splunksvc_splunkenv
  type: Application
  description: ""
  serviceRef: splunksvc
  environmentRef: splunkenv
  environmentRefList:
  - splunkenv
  sources:
    healthSources:
    - name: prome
      identifier: prome
      type: Prometheus
      spec:
        connectorRef: promlocal
        metricPacks:
        - identifier: Custom
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: RESP_TIME
            riskCategory: Performance_ResponseTime
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: RESP_TIME
              riskCategory: Performance_ResponseTime
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "avg(up{job=\"cv-datagen\"})"
          groupName: G1
          serviceInstanceFieldName: instance
          isManualQuery: true
    - name: splunk-hs
      identifier: splunkhs
      type: Splunk
      spec:
        connectorRef: splunkhs
        feature: Splunk Cloud Logs
        queries:
        - name: SPLUNK Logs Query
          query: error OR failed OR severe OR ( sourcetype=access_* ( 404 OR 500 OR
            503 ) )
          serviceInstanceIdentifier: test
  enabled: false
