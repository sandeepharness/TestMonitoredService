monitoredService:
  orgIdentifier: default
  projectIdentifier: gitxtest
  identifier: runtimesvc_runtimeenv
  name: runtimesvc_runtimeenv
  type: Application
  description: ""
  serviceRef: runtimesvc
  environmentRef: runtimeenv
  environmentRefList:
  - runtimeenv
  sources:
    healthSources:
    - name: cv-two-branch-hs
      identifier: cvtwobranchhs
      type: Prometheus
      spec:
        connectorRef: account.promeacc
        metricPacks:
        - identifier: Custom
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: RESP_TIME
            riskCategory: Performance_ResponseTime
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: RESP_TIME
              riskCategory: Performance_ResponseTime
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "avg(up{job=\"cv-datagen\"})"
          groupName: G1
          serviceInstanceFieldName: instance
          isManualQuery: true
  enabled: false
