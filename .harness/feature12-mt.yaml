monitoredService:
  orgIdentifier: default
  projectIdentifier: CV_Sanity
  identifier: testabhijith_TestEnv1
  name: testabhijith_TestEnv1
  type: Application
  description: ""
  serviceRef: testabhijith
  environmentRef: TestEnv1
  environmentRefList:
  - TestEnv1
  sources:
    healthSources:
    - name: prme-feature12
      identifier: prmefeature12
      type: Prometheus
      spec:
        connectorRef: promeprojcheck
        metricPacks:
        - identifier: Custom
          metricThresholds:
          - metricName: Prometheus Metric
            metricType: Custom
            spec:
              action: FailImmediately
              spec: {}
            criteria:
              type: Percentage
              spec:
                greaterThan: 2.0
            type: FailImmediately
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: RESP_TIME
            riskCategory: Performance_ResponseTime
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: RESP_TIME
              riskCategory: Performance_ResponseTime
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "(sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"\
            online-boutique\",http_response_status_code!~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=\"\
            online-boutique\"}[5m]))) * 100"
          groupName: G1
          serviceInstanceFieldName: instance
          isManualQuery: true
  enabled: false
