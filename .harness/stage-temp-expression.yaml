template:
  name: run-time-feature-stage01
  identifier: runtimefeaturestage01
  versionLabel: v1
  type: Stage
  projectIdentifier: gitxtest
  orgIdentifier: default
  tags: {}
  spec:
    type: Deployment
    spec:
      deploymentType: Kubernetes
      environment:
        environmentRef: <+stage.variables.Env_name>
        deployToAll: false
        infrastructureDefinitions:
          - identifier: <+stage.variables.infra_name>
      service:
        serviceRef: <+stage.variables.service_name>
      execution:
        steps:
          - step:
              type: Verify
              name: Verify_1
              identifier: Verify_1
              spec:
                isMultiServicesOrEnvs: false
                type: Rolling
                monitoredService:
                  type: Default
                  spec: {}
                spec:
                  sensitivity: HIGH
                  duration: 5m
              timeout: 2h
              failureStrategies:
                - onFailure:
                    errors:
                      - Verification
                    action:
                      type: ManualIntervention
                      spec:
                        timeout: 2h
                        onTimeout:
                          action:
                            type: StageRollback
                - onFailure:
                    errors:
                      - Unknown
                    action:
                      type: ManualIntervention
                      spec:
                        timeout: 2h
                        onTimeout:
                          action:
                            type: Ignore
        rollbackSteps: []
    failureStrategies:
      - onFailure:
          errors:
            - AllErrors
          action:
            type: StageRollback
    variables:
      - name: service_name
        type: String
        description: ""
        required: true
        value: mainbranchsvc
      - name: Env_name
        type: String
        description: ""
        required: false
        value: mainbranchenv
      - name: infra_name
        type: String
        description: ""
        required: false
        value: mainbranchenv
