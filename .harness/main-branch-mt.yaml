monitoredService:
  orgIdentifier: default
  projectIdentifier: gitxtest
  identifier: mainbranchsvc_mainbranchenv
  name: mainbranchsvc_mainbranchenv
  type: Application
  description: ""
  serviceRef: mainbranchsvc
  environmentRef: mainbranchenv
  environmentRefList:
  - mainbranchenv
  sources:
    healthSources:
    - name: splunk-remote
      identifier: splunkremote
      type: Splunk
      spec:
        connectorRef: splunkhs
        feature: Splunk Cloud Logs
        queries:
        - name: SPLUNK Logs Query
          query: index=_internal " error " NOT debug source=*splunkd.log*
          serviceInstanceIdentifier: "['host']"
    - name: cv-prome-1
      identifier: cvprome1
      type: Prometheus
      spec:
        connectorRef: account.promeacc
        metricPacks:
        - identifier: Custom
        metricDefinitions:
        - identifier: prometheus_metric
          metricName: Prometheus Metric
          riskProfile:
            category: Performance
            metricType: RESP_TIME
            riskCategory: Performance_ResponseTime
            thresholdTypes:
            - ACT_WHEN_LOWER
          analysis:
            liveMonitoring:
              enabled: false
            deploymentVerification:
              enabled: true
              serviceInstanceFieldName: instance
            riskProfile:
              category: Performance
              metricType: RESP_TIME
              riskCategory: Performance_ResponseTime
              thresholdTypes:
              - ACT_WHEN_LOWER
          sli:
            enabled: false
          query: "avg(up{job=\"cv-datagen\"})"
          groupName: g1
          serviceInstanceFieldName: instance
          isManualQuery: true
  enabled: false
