pipeline:
  name: test-pipe-expression-svc-env
  identifier: testpipeexpressionsvcenv
  projectIdentifier: gitxtest
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: d-v
        identifier: dv
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+pipeline.variables.Service_name>
          environment:
            environmentRef: <+pipeline.variables.Env_name>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+pipeline.variables.infra_name>
          execution:
            steps:
              - step:
                  type: Verify
                  name: Verify_1
                  identifier: Verify_1
                  spec:
                    isMultiServicesOrEnvs: false
                    type: Rolling
                    monitoredService:
                      type: Default
                      spec: {}
                    spec:
                      sensitivity: HIGH
                      duration: 5m
                  timeout: 2h
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Verification
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 2h
                            onTimeout:
                              action:
                                type: StageRollback
                    - onFailure:
                        errors:
                          - Unknown
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 2h
                            onTimeout:
                              action:
                                type: Ignore
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  variables:
    - name: Service_name
      type: String
      description: ""
      required: true
      value: mainbranchsvc
    - name: Env_name
      type: String
      description: ""
      required: false
      value: mainbranchenv
    - name: infra_name
      type: String
      description: ""
      required: false
      value: mainbranchinfra
