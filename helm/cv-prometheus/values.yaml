replicaCount: 1

# Image wiring: Harness substitutes the primary artifact (image + resolved tag).
image: <+artifacts.primary.image>
imagePullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

prometheus:
  scrape: "true"
  path: /metrics
  port: "8080"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
